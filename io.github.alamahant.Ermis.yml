app-id: io.github.alamahant.Ermis
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: Ermis
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
# Needed for two instances of the app to send/receive steganography content embedded in icmp/udp/dns or http packets.
  - --share=network
modules:
  - name: Ermis
    buildsystem: cmake-ninja
    config-opts:
      - -DFLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin/ld
      - /bin/as
      - /bin/gold
      - /bin/gprof
      - /bin/ar
      - /bin/ranlib
      - /bin/strings
      - /bin/strip
      - /bin/nm
      - /bin/objdump
      - /bin/size
      - /bin/elfedit
      - /bin/*.py
      - /lib/*.a
      - /lib/*.la
      #- /lib/libbfd-*
      #- /lib/libopcodes-*
      - /lib/libctf-*
      - /lib/libsframe-*
      - /lib/libgnu-*
      - /lib/bfd-plugins
      - /lib/ldscripts
      - /lib/cmake
      - /include
      - /share
    sources:
      # binutils source code
      - type: archive
        url: https://ftp.gnu.org/gnu/binutils/binutils-2.46.0.tar.xz
        sha256: d75a94f4d73e7a4086f7513e67e439e8fcdcbb726ffe63f4661744e6256b2cf2
        dest: binutils_src

      - type: git
        url: https://github.com/alamahant/Ermis.git
        tag: v1.1.2
        commit: 102224905ab7446d53e9feace87050aca50be1a2
      
